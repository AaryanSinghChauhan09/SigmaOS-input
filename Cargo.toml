[package]
name = "sigmaos-input"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Input device management (keyboard, mouse, touch)"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-input"
readme = "README.md"
keywords = ["input", "keyboard", "mouse"]
categories = ["os"]

[dependencies]
sigmaos-kernel = { version = "0.1", path = "../SigmaOS-kernel" }

[profile.release]
opt-level = 3
